---
# tasks file for roles/dnsmasq

- name: install dnsmasq
  apt:
    name: dnsmasq
    state: present
    update_cache: true

- name: deploy dnsmasq config
  template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.d/dev.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - restart dnsmasq

- name: enable dnsmasq
  systemd:
    name: dnsmasq
    enabled: true
    state: started